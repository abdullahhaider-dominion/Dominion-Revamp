<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="deckFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AF0D4" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#2A6B5E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0A141C" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="deckSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7CF0C8" stop-opacity="0"/>
      <stop offset="22%" stop-color="#7CF0C8" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#B8FFE8" stop-opacity="0.28"/>
      <stop offset="78%" stop-color="#7CF0C8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7CF0C8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#47BD68" stop-opacity="0"/>
      <stop offset="12%" stop-color="#5FE8C0" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#B8FFF0" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#E8FFF8" stop-opacity="1"/>
      <stop offset="65%" stop-color="#B8FFF0" stop-opacity="0.95"/>
      <stop offset="88%" stop-color="#5FE8C0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#47BD68" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="rimBlur" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- under glow -->
  <ellipse cx="600" cy="190" rx="420" ry="28" fill="#47BD68" opacity="0.22" filter="url(#rimBlur)"/>

  <!-- deck body (elongated hex / trapezoid) -->
  <path d="M110 70 L1090 70 L1180 168 L20 168 Z" fill="url(#deckFill)" stroke="rgba(120,240,210,0.35)" stroke-width="1.5"/>
  <path d="M110 70 L1090 70 L1180 168 L20 168 Z" fill="url(#deckSheen)"/>

  <!-- top specular edge -->
  <path d="M130 72 L1070 72" stroke="rgba(220,255,245,0.55)" stroke-width="2" stroke-linecap="round"/>

  <!-- front rim glow -->
  <path d="M28 166 L1172 166" stroke="url(#rimGlow)" stroke-width="5" stroke-linecap="round" filter="url(#softGlow)"/>
  <path d="M40 166 L1160 166" stroke="#E8FFF8" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>

  <!-- light flares where cards meet deck -->
  <g opacity="0.85">
    <ellipse cx="260" cy="118" rx="70" ry="10" fill="#9AF0D4" opacity="0.35" filter="url(#rimBlur)"/>
    <ellipse cx="600" cy="112" rx="90" ry="12" fill="#B8FFF0" opacity="0.45" filter="url(#rimBlur)"/>
    <ellipse cx="940" cy="118" rx="70" ry="10" fill="#9AF0D4" opacity="0.35" filter="url(#rimBlur)"/>
  </g>
</svg>
