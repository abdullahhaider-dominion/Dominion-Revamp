<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Magic Keys">
  <defs>
    <filter id="mkGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="14" y="14" width="100" height="100" rx="26" fill="rgba(8,22,30,0.55)" stroke="#47BD68" stroke-width="3.5" filter="url(#mkGlow)"/>
  <rect x="14" y="14" width="100" height="100" rx="26" fill="none" stroke="rgba(122,232,160,0.55)" stroke-width="1"/>
  <text x="64" y="82" text-anchor="middle" font-family="Poppins, Montserrat, Arial, sans-serif" font-size="42" font-weight="800" fill="#5FE389" letter-spacing="-1.5" filter="url(#mkGlow)">MK</text>
</svg>
